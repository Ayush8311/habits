<!--
  Habit app icon: the master artwork. `npm run icons` renders every icon in public/
  from this file, so edit it here and regenerate.

  A forest-green check mark whose long stroke curves into a progress ring and carries
  on around it; the pale sage arc it hasn't reached yet is the progress still to come.
  512-unit, full-bleed square: platforms and the generator add their own rounding.
  All artwork lies within 167 units of the centre, inside the 204-unit safe zone of
  Android's maskable icons.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect id="background" width="512" height="512" fill="#F4F1E8"/>
  <g id="artwork" fill="none" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="150" stroke="#DCE6D8"/>
    <path d="M184 260 L238 312 L328 192 Q371.4 134.2 397 204.7 A150 150 0 1 1 230 108.3" stroke="#2F6E4B"/>
  </g>
</svg>
