# Builds the Habit Android app (Capacitor) as an APK.
#
#   Push a version tag (git push origin v1.0.1)
#     → builds a SIGNED release APK and attaches habit-v1.0.1.apk and its SHA-256 to
#       the GitHub Release for that tag. The release itself is created by release.yml;
#       this workflow waits for it and never creates a second one or replaces a file.
#   Actions → Android APK → Run workflow
#     → "debug": a test APK ("Habit Debug", installs alongside the real app), as a
#       downloadable workflow artifact only.
#     → "release": a signed APK as a workflow artifact only (nothing is attached).
#
# Jobs: build → verify-artifact (every run: downloads the artifact and checks it again)
#       → attach (version tags only). The APK moves between jobs only as the workflow
#       artifact habit-android-<variant>, never through job outputs: GitHub drops any
#       output whose value contains a secret, and the key alias can be part of the name.
#
# Ordinary commits never trigger it. Release builds never fall back to unsigned.
#
# Required repository secrets for release builds (see README → Android app):
#   ANDROID_KEYSTORE_BASE64   the release keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
# Required repository variable for release builds:
#   ANDROID_SIGNING_CERT_SHA256  the release certificate's SHA-256 fingerprint; an APK
#                                signed with any other key fails, so updates always
#                                install over earlier versions.

name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      variant:
        description: 'debug = test build; release = signed build (needs the signing secrets)'
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  VARIANT: ${{ github.event_name == 'push' && 'release' || inputs.variant }}
  ARTIFACT: habit-android-${{ github.event_name == 'push' && 'release' || inputs.variant }}
  APK_DIR: apk-out

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"; exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG must point at a commit on main"; exit 1
          fi

      - name: Check signing configuration
        if: env.VARIANT == 'release'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          missing=()
          [ -n "$KEYSTORE" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$STORE_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::A release APK must be signed, and these repository secrets are missing: ${missing[*]}. See README → Android app → Release signing. For a test build, run this workflow with variant 'debug'."
            exit 1
          fi
          if ! [[ "$(echo "$EXPECTED_CERT" | tr -d ': ')" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo "::error::Set the repository variable ANDROID_SIGNING_CERT_SHA256 to the release certificate's SHA-256 fingerprint (64 hex digits, colons allowed), so the APK's signature can be checked. See README → Android app → Release signing."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      # Validates the Gradle wrapper checksum and caches Gradle downloads.
      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: npx cap sync android

      - name: Build ${{ env.VARIANT }} APK
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HABIT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HABIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HABIT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then
            # The keystore exists only for this step, outside the workspace.
            export HABIT_KEYSTORE_FILE="$RUNNER_TEMP/habit-release.jks"
            trap 'rm -f "$HABIT_KEYSTORE_FILE"' EXIT
            printf '%s' "$KEYSTORE" | base64 --decode > "$HABIT_KEYSTORE_FILE"
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      # Copies the APK into APK_DIR under its release name with a .sha256, and checks
      # signature, certificate, package name and version (scripts/android-apk.sh).
      - name: Verify and package the APK
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          if [ "$VARIANT" = release ]; then
            src=android/app/build/outputs/apk/release/app-release.apk
          else
            src=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          scripts/android-apk.sh package "$VARIANT" "$src" "$APK_DIR"

      # Uploads only APK_DIR, which verification has checked holds exactly the APK and
      # its .sha256: no keystore or signing properties.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.APK_DIR }}/
          if-no-files-found: error
          retention-days: 30

  # Runs for every build, including manual ones, with read-only access: proves the
  # artifact downloads intact and is the APK a release would get.
  verify-artifact:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node reads package.json; Java runs apksigner. Both pinned rather than taken
      # from whatever the runner image ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: build-tools;36.0.0

      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.APK_DIR }}

      - name: Verify the downloaded APK
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: scripts/android-apk.sh verify "$VARIANT" "$APK_DIR"

      - name: Summary
        run: |
          apk=$(scripts/android-apk.sh name "$VARIANT")
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "Verified $apk; the attach job adds it to the $GITHUB_REF_NAME release."
          else
            echo "Verified $apk. Manual build: download the '$ARTIFACT' artifact from this run's Summary page. Nothing is published."
          fi

  attach:
    needs: verify-artifact
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the existing release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.APK_DIR }}

      - name: Check the downloaded files
        run: |
          apk=$(scripts/android-apk.sh name release)
          [ "$apk" = "habit-$TAG.apk" ] || { echo "::error::Expected habit-$TAG.apk, not $apk"; exit 1; }
          [ "$(cd "$APK_DIR" && LC_ALL=C ls -A)" = "$(printf '%s\n%s' "$apk" "$apk.sha256")" ] ||
            { echo "::error::The artifact must contain exactly $apk and $apk.sha256"; exit 1; }
          (cd "$APK_DIR" && sha256sum -c "$apk.sha256")

      # release.yml publishes the release after its own checks (including the live
      # site); wait for it rather than creating a second release.
      - name: Wait for the ${{ github.ref_name }} release
        run: |
          for attempt in $(seq 1 40); do
            if gh release view "$TAG" >/dev/null 2>&1; then echo "Found release $TAG."; exit 0; fi
            echo "Release $TAG not published yet (check $attempt of 40); waiting 30 s…"
            sleep 30
          done
          echo "::error::Release $TAG does not exist after 20 minutes. Check the 'Release' workflow run for $TAG; once it has published the release, re-run this workflow's failed jobs."
          exit 1

      - name: Attach the APK
        run: |
          apk=$(scripts/android-apk.sh name release)
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          has() { grep -qxF "$1" <<<"$assets"; }
          if has "$apk" && has "$apk.sha256"; then
            echo "$apk and its checksum are already attached to $TAG; leaving the published files unchanged."
            exit 0
          fi
          if has "$apk" || has "$apk.sha256"; then
            echo "::error::$TAG has only one of $apk and $apk.sha256 attached. Not replacing a published file: check the release's assets by hand."
            exit 1
          fi
          # No --clobber: an asset that appeared meanwhile makes this fail rather than be replaced.
          gh release upload "$TAG" "$APK_DIR/$apk" "$APK_DIR/$apk.sha256"
          echo "Attached $apk and $apk.sha256 to $TAG."
