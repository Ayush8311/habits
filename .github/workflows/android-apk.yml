# Builds the Habit Android app (Capacitor) as an APK.
#
#   Push a version tag (git push origin v1.0.1)
#     → builds a SIGNED release APK and attaches habit-v1.0.1.apk and its SHA-256 to
#       the GitHub Release for that tag. The release itself is created by release.yml;
#       this workflow waits for it and never creates a second one.
#   Actions → Android APK → Run workflow
#     → "debug": a test APK ("Habit Debug", installs alongside the real app), as a
#       downloadable workflow artifact only.
#     → "release": a signed APK as a workflow artifact only (nothing is attached).
#
# Ordinary commits never trigger it. Release builds never fall back to unsigned.
#
# Required repository secrets for release builds (see README → Android app):
#   ANDROID_KEYSTORE_BASE64   the release keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
# Recommended repository variable:
#   ANDROID_SIGNING_CERT_SHA256  the release certificate's SHA-256 fingerprint; if set,
#                                an APK signed with any other key fails the build, so
#                                updates always install over earlier versions.

name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      variant:
        description: 'debug = test build; release = signed build (needs the signing secrets)'
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.package.outputs.apk }}
    env:
      VARIANT: ${{ github.event_name == 'push' && 'release' || inputs.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"; exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG must point at a commit on main"; exit 1
          fi

      - name: Check signing configuration
        if: env.VARIANT == 'release'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$STORE_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::A release APK must be signed, and these repository secrets are missing: ${missing[*]}. See README → Android app → Release signing. For a test build, run this workflow with variant 'debug'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      # Validates the Gradle wrapper checksum and caches Gradle downloads.
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: npx cap sync android

      - name: Build ${{ env.VARIANT }} APK
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HABIT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HABIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HABIT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$VARIANT" = release ]; then
            # The keystore exists only for this step, outside the workspace.
            export HABIT_KEYSTORE_FILE="$RUNNER_TEMP/habit-release.jks"
            trap 'rm -f "$HABIT_KEYSTORE_FILE"' EXIT
            printf '%s' "$KEYSTORE" | base64 --decode > "$HABIT_KEYSTORE_FILE"
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Verify and package the APK
        id: package
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          version=$(node -p "require('./package.json').version")
          code=$(node -p "const [a,b,c]=require('./package.json').version.split('-')[0].split('.').map(Number); a*10000+b*100+c")
          if [ "$VARIANT" = release ]; then
            src=android/app/build/outputs/apk/release/app-release.apk
            package=com.ayush8311.habit; name_version="$version"
          else
            src=android/app/build/outputs/apk/debug/app-debug.apk
            package=com.ayush8311.habit.debug; name_version="$version-debug"
          fi
          [ -f "$src" ] || { echo "::error::No APK at $src"; exit 1; }

          # A valid, signed Android package with the expected identity and version.
          "$build_tools/apksigner" verify --verbose --print-certs "$src" | tee apksigner.txt
          badging=$("$build_tools/aapt2" dump badging "$src")
          echo "$badging" | head -1
          echo "$badging" | grep -q "package: name='$package' versionCode='$code' versionName='$name_version'" ||
            { echo "::error::APK identity is not $package $name_version ($code)"; exit 1; }

          if [ "$VARIANT" = release ] && [ -n "$EXPECTED_CERT" ]; then
            actual=$(grep -m1 'certificate SHA-256 digest' apksigner.txt | awk '{print $NF}')
            expected=$(echo "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            [ "$actual" = "$expected" ] ||
              { echo "::error::APK is signed with certificate $actual, not the Habit release key $expected. Updates would not install over earlier versions."; exit 1; }
            echo "Signed with the Habit release key."
          fi

          if [ "$GITHUB_EVENT_NAME" = push ]; then label="$GITHUB_REF_NAME"; else label="v$version-${GITHUB_SHA::7}"; fi
          if [ "$VARIANT" = debug ]; then apk="habit-$label-debug.apk"; else apk="habit-$label.apk"; fi
          cp "$src" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 30

  attach:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the existing release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      APK: ${{ needs.build.outputs.apk }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk

      # release.yml publishes the release after its own checks (including the live
      # site); wait for it rather than creating a second release.
      - name: Wait for the ${{ github.ref_name }} release
        run: |
          for attempt in $(seq 1 40); do
            if gh release view "$TAG" >/dev/null 2>&1; then echo "Found release $TAG."; exit 0; fi
            echo "Release $TAG not published yet (check $attempt of 40); waiting 30 s…"
            sleep 30
          done
          echo "::error::Release $TAG does not exist after 20 minutes. Check the 'Release' workflow run for $TAG; once it has published the release, re-run this workflow's failed jobs."
          exit 1

      - name: Attach the APK
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if grep -qxF "$APK" <<<"$assets"; then
            echo "$APK is already attached to $TAG; leaving the published file unchanged."
            exit 0
          fi
          gh release upload "$TAG" "$APK" "$APK.sha256"
          echo "Attached $APK and $APK.sha256 to $TAG."
