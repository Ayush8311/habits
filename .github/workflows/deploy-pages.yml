# Builds Habit and publishes it to GitHub Pages.
#
# One-time setup (repository Settings):
#   1. Pages → Build and deployment → Source: "GitHub Actions".
#      (GitHub Pages for a private repository needs a paid GitHub plan.)
#   2. Then either run this workflow from the Actions tab, or, to deploy on
#      every push to main, add a repository variable DEPLOY_TO_PAGES = true
#      (Settings → Secrets and variables → Actions → Variables).
#
# The base path comes from GitHub: "/<repository>/" for a project site, or "/"
# when a custom domain is configured, so assets, the manifest and the service
# worker always resolve correctly.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_TO_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
