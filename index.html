<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="A calm, personal habit tracker: check in daily, keep streaks and see your progress." />
    <meta name="application-name" content="mink" />
    <meta name="theme-color" content="#4A9466" />
    <meta name="color-scheme" content="light dark" />
    <!-- Sets the chosen appearance before the first paint (src/lib/theme.js keeps it current). -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var choice = localStorage.getItem('habit.theme');
          var dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          theme = dark ? 'dark' : 'light';
        } catch (error) {}
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
      })();
    </script>

    <!-- Home Screen web app on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="mink" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>mink</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>mink needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
